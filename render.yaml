# OKami24 — Render deployment blueprint (owner decision 2026-09-06: Render, Singapore).
#
# This file is the deploy settings written down, so the dashboard form does not have to be filled
# in from memory. In Render: New → Blueprint → pick this repo → it reads this file.
# Step-by-step, in plain Thai, including what to click and what "success" looks like:
#   docs/DEPLOY-RENDER.md
#
# The three things this file exists to get right, because getting them wrong loses orders:
#   1. ONE instance, never more. The store is a single SQLite file; a second instance would open
#      its own copy and split the orders (see src/lib/db/client.ts).
#   2. A persistent disk, with the app's data folder pointed at it. Without the disk, every
#      redeploy starts from an empty database.
#   3. Singapore — the customers are in Thailand.
services:
  - type: web
    name: okami24
    runtime: node
    plan: starter
    region: singapore
    # `main` is the live branch (owner decision 2026-09-06).
    branch: main
    # Four steps. The two in the middle exist because of the exit-139 crash of 2026-09-06 (the
    # first "add to cart" on the live site killed the process — docs/INCIDENT_2026-09-06_sqlite-segfault.md):
    #   npm ci                              installs exactly what package-lock.json pins. It compiles
    #                                       nothing — both native modules ship prebuilt binaries.
    #   node scripts/build-native-sqlite.js OPT-IN, does nothing unless OKAMI24_SQLITE_FROM_SOURCE=1
    #                                       is set in the dashboard: compiles better-sqlite3 on this
    #                                       host and removes the shipped Linux binary. Not the fix
    #                                       for the 2026-09-06 crash (see below) — kept for the day a
    #                                       shipped binary genuinely does not fit the host.
    #   node scripts/check-native-sqlite.js THE GATE. First asks whether this Node's Node-API version
    #                                       is at least what better-sqlite3 declares, and fails with a
    #                                       plain-language message if not — that mismatch IS the
    #                                       2026-09-06 crash, and asking beforehand is the only way to
    #                                       see it, because loading the addon on the wrong Node kills
    #                                       the process without a word. Then loads the addon, opens a
    #                                       database, writes and reads. Any failure fails the deploy.
    #   npm run build                       the Next.js build.
    # A failing gate fails the deploy — on purpose. The alternative was learning about it from a
    # customer.
    buildCommand: npm ci && node scripts/build-native-sqlite.js && node scripts/check-native-sqlite.js && npm run build
    startCommand: npm start
    healthCheckPath: /
    # Deliberately manual for launch: a push to `main` should not reach customers before someone
    # has looked at it. Turn this on in Settings once the site has been live and stable for a
    # while — the owner decides, not this file.
    autoDeploy: false
    disk:
      name: okami24-data
      mountPath: /var/data
      # The database is measured in kilobytes today; 1 GB is already enormous for it. Render can
      # grow a disk later but never shrink it, so this starts small on purpose.
      sizeGB: 1
    envVars:
      # Node 24 LTS — owner's decision 2026-09-06, after confirming the cause in Render's shell.
      #
      # !! NEVER BELOW 22.14.0. better-sqlite3 13 declares Node-API version 10, which Node gained in
      # 22.14.0; on anything older, loading the addon segfaults instead of raising an error — that
      # was the 2026-09-06 outage, pinned at 22.11.0 right here. 24.14.1 is Render's default, the
      # version the shipped Linux binary was built with, and the major the dev machine runs, so dev
      # and prod agree. package.json "engines" carries the same floor, and the gate in the
      # buildCommand refuses to build on a Node that cannot load the addon, so a wrong value here
      # fails the deploy with a message rather than the site.
      - key: NODE_VERSION
        value: 24.14.1
      # Backup file names and log timestamps are written in the server's local time — without
      # this they would read 7 hours behind Thai time and be confusing to match against a report.
      - key: TZ
        value: Asia/Bangkok
      # Baked into canonical/sitemap/robots/OpenGraph/JSON-LD. src/lib/seo.ts refuses to build in
      # production without it, on purpose.
      - key: SITE_URL
        value: https://okami24.store
      # The two paths that MUST live on the disk above: the SQLite store + the private PromptPay
      # QR folder, and the automatic backups. See src/lib/paths.ts.
      - key: OKAMI24_DATA_DIR
        value: /var/data/app-data
      - key: OKAMI24_BACKUP_DIR
        value: /var/data/backups
      # Node's diagnostic report, written to the DISK so it survives the restart that follows a
      # crash. Honest about what this does and does not catch (tested 2026-09-06):
      #   - it DOES catch Node dying on its own — an out-of-memory heap abort writes a full report
      #     (native stack, loaded libraries, memory, cgroup limits)
      #   - it does NOT catch a segfault inside a native addon. The kernel kills the process outright
      #     and no Node handler runs, so the exit-139 crash this file is dated against would leave no
      #     report at all. The evidence for that one is the `[probe]` log written at boot by
      #     scripts/native-probe.js, not a file here.
      # Kept because the OOM case is real and cheap to cover, and because ruling memory in or out is
      # one of the open questions. `--report-on-signal` listens on SIGUSR2, not SIGTERM, so Render's
      # ordinary shutdown during a redeploy is unaffected.
      - key: NODE_OPTIONS
        value: --report-on-fatalerror --report-on-signal --report-directory=/var/data
