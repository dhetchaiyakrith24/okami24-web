# PR checks only — Render builds and deploys main by itself (round "move the build to Render", owner 21/10 "ครับงั้นตามนั้นเลย
# จะได้ไม่เสียเงิน 2 ต่อ"). Until 21/10 this workflow ran a full `next build` on every ready PR push and again on every merge,
# then called the Render deploy hook — and Render built the site a third time. The full build + leak check now run on the
# local test server before the checker (TEAM_RULES 13.4 / 13.5) and on Render at deploy (render.yaml autoDeployTrigger:
# commit — a failed build is not deployed and the previous deploy keeps serving).
#
#   pull_request  → decide (scripts/deploy-decision.js — does the PR reach the site?) → checks: verify:commerce +
#                   verify:catalog (tsc · eslint · contract tests, no build) — the required checks "checks" (branch rule)
#                   · a draft PR runs nothing; mark it ready once, after the checker PASS
#   Run workflow  → (Actions tab) the same checks on the chosen branch; full=true adds the build + leak check (--full)
#
# Undo: revert the PR that brought this file (the push trigger + the deploy-hook job come back) and set render.yaml back to
# `autoDeployTrigger: off`. Undo a bad deploy: Render → Rollback (docs/RECOVERY.md).
name: deploy
on:
  pull_request:
    # ready_for_review: a draft PR runs nothing (job `decide` below); marking it ready runs the checks once
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the full build + leak check (verify:catalog --full)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # a draft-time (skipped) run has its own group, so it can never cancel the real ready_for_review run (PR #666, 21/10)
  group: deploy-${{ github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  decide:
    # Draft PRs skip the whole workflow (owner 21/10 "ลดรอบ": every push to an open PR rebuilt the site, which
    # used up the month's Actions minutes). Work in progress = draft; "Ready for review" once, after the checker PASS.
    # A skipped required job counts as passed, but a draft cannot be merged anyway.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.d.outputs.deploy }}
      checks: ${{ steps.d.outputs.deploy == 'true' || steps.d.outputs.pipeline == 'true' || github.event_name == 'workflow_dispatch' }}
      reason: ${{ steps.d.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Does this change reach the site?
        id: d
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT" in
            pull_request)      node scripts/deploy-decision.js --range "$PR_BASE...$PR_HEAD" ;;
            workflow_dispatch) node scripts/deploy-decision.js --files "" ;;
          esac
      - name: Summary
        env:
          DEPLOY: ${{ steps.d.outputs.deploy }}
          REASON: ${{ steps.d.outputs.reason }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then what="PR checks — Render deploys main by itself after the merge"; else what="commit ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}"; fi
          if [ "$DEPLOY" = "true" ]; then verdict="reaches the site — checks run"; else verdict="does not reach the site"; fi
          echo "### ${verdict}" >> "$GITHUB_STEP_SUMMARY"
          echo "${what} · ${REASON}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=deploy decision::${verdict} — ${REASON}"

  checks:
    needs: decide
    if: needs.decide.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE_URL: https://okami24.store
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the content-dates contract test compares dates with git (a shallow clone fails it)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Next types (tsc needs them before the first build)
        run: npx next typegen
      - name: verify:commerce
        run: npm run verify:commerce
      - name: verify:catalog (tsc · eslint · contract tests — the build runs on the test server and on Render)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full) }}
        run: npm run verify:catalog
      - name: verify:catalog --full (by hand only — tsc · eslint · contract tests · next build · leak check)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: npm run verify:catalog -- --full

